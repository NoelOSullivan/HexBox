<div #graph class="graph">
  @for (headInfo of headInfos; track headInfo; let i = $index) {
    <div class="bar-holder" id="bar{{i}}">
      @if (language==='Fr') {
        <div class="name-tag">{{headInfo.nameFr}}</div>
      }
      @if (language==='En') {
        <div class="name-tag">{{headInfo.nameUk}}</div>
      }
    </div>
  }

</div>
