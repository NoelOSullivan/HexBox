<div #hoopHolder class="hoop-holder">
  <div class="background-circle"></div>
  <div class="arc arc-top"></div>
  <div class="head-holder">
    <div #head class="head" [ngClass]="{'head-down':headUp ===false}">
      @if (language==='Fr') {
        <img class="head-image" src="{{headSrcFr}}">
      }
      @if (language==='En') {
        <img class="head-image" src="{{headSrcUk}}">
      }
      @if (showEgg) {
        <img #egg class="egg-image" src="assets/images/thesun/cracked-egg.png">
      }
    </div>
  </div>
  <div class="arc arc-bottom"></div>
</div>
