<div #contentHolder id="contentHolder" class="content-holder">
  @if (nContainer===1) {
  <span class="show-content" [ngClass]="{'hide-content':activePanelNumber!==1}">
    <app-container1 [nContainer]="nContainer"></app-container1>
  </span>
  }
  @if (nContainer===2) {
  <span class="show-content" [ngClass]="{'hide-content':activePanelNumber!==2}">
    <app-container2 [nContainer]="nContainer"></app-container2>
  </span>
  }
  @if (nContainer===3) {
  <span class="show-content" [ngClass]="{'hide-content':activePanelNumber!==3}">
    <app-container3 [nContainer]="nContainer"></app-container3>
  </span>
  }
  @if (nContainer===4) {
  <span class="show-content" [ngClass]="{'hide-content':activePanelNumber!==4}">
    <app-container4 [nContainer]="nContainer"></app-container4>
  </span>
  }
  @if (nContainer===5) {
  <span class="show-content" [ngClass]="{'hide-content':activePanelNumber!==5}">
    <app-container5 [nContainer]="nContainer"></app-container5>
  </span>
  }
  @if (nContainer===6) {
  <span class="show-content" [ngClass]="{'hide-content':activePanelNumber!==0}">
    <app-container6 [nContainer]="nContainer"></app-container6>
  </span>
  }
</div>
