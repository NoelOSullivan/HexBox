<nav #carouselRoot class="carousel-root">
    <div class="carousel-event-capture"></div>
    <div #carousel class="carousel" [ngClass]="{'auto-animate':scrollType==='auto'}">
        <li class="carousel-item" *ngFor="let item of items; let  i = index" id="item{{i}}"
            (click)="itemClicked($event,item)">
            @if (itemType==='imageText') {
            <div class="item-holder">
                <div class="logo-holder">
                    <img class="svg-icon" src="{{item.imageSrc}}" />
                </div>
                <div class="text-holder"  [ngClass]="{'centre-blurb':item.page === undefined}">
                    <div class="intro">
                        @if (language==='En') {
                        <span [innerHTML]="item.introEn"></span>
                        }
                        @if (language==='Fr') {
                        <span [innerHTML]="item.introFr"></span>
                        }
                    </div>
                    <div class="text">
                        @if (language==='En') {
                        <span [innerHTML]="item.textEn"></span>
                        }
                        @if (language==='Fr') {
                        <span [innerHTML]="item.textFr"></span>
                        }
                    </div>
                </div>
            </div>
            }
            @if (itemType==='image') {
            <div class="item-holder">
                <div class="image-holder">
                    <img class="image" src="{{item.imageSrc}}" />
                </div>
            </div>
            }
            @if (item.page) {
            <div class="click-indicator">
                <div class="icon-holder">
                    <app-swipe-icon [direction]="'right'" [buttonText]="buttonText"></app-swipe-icon>
                </div>
            </div>
            }
            <div #shadow class="shadow"></div>
        </li>
    </div>
    @if (itemType==='image') {
    <div>
        <div class="caption-title">{{captionTitle}}</div>
        <div class="caption-text">{{captionText}}</div>
    </div>
    }
</nav>
